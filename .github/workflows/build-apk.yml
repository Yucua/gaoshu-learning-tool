name: 打包安卓 APK

# 手动触发 + 推送到 main 时触发
on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: 设置 Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 安装依赖
        run: npm install

      - name: 生成单文件版并同步到 android
        run: |
          node 构建单文件版.js
          node -e "require('fs').copyFileSync('高数学习工具.html','www/index.html')"
          npx cap sync android

      - name: 赋予 gradlew 执行权限
        run: chmod +x android/gradlew

      - name: 打包 debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: gaoshu-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
