<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>同济高数 · 学习工具</title>
<script>
/* 主题：在首帧前应用，避免闪白/闪黑。light / dark */
(function(){ try{ var t = localStorage.getItem("gaoshu_theme"); if(t === "dark"){ document.documentElement.setAttribute("data-theme","dark"); } }catch(e){} })();
</script>
<link rel="stylesheet" href="vendor/katex/katex.min.css" />
<script defer src="vendor/katex/katex.min.js"></script>
<script defer src="vendor/katex/contrib/auto-render.min.js"></script>
<script defer src="vendor/fuse/fuse.min.js"></script>
<style>
:root{--bg:#f7f3ea;--paper:#fffdf7;--ink:#2b2a26;--ink-soft:#5f5b51;--line:#e7ddc9;--accent:#b4552d;--accent-soft:#f3e3d5;--green:#3f7d5a;--green-soft:#e4efe7;--amber:#c98a2b;--amber-soft:#f6ecd6;--red:#9c3b32;--red-soft:#f6e3e0;--blue:#2f5f8f;--blue-soft:#dde8f1;--radius:14px;--shadow:0 2px 10px rgba(60,45,20,.06),0 1px 3px rgba(60,45,20,.05);}
*{box-sizing:border-box;}html,body{margin:0;padding:0;width:100%;max-width:100%;}
body{background:var(--bg);color:var(--ink);line-height:1.75;font-family:"PingFang SC","Microsoft YaHei","Hiragino Sans GB",sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden;}
.shell{display:flex;width:100%;max-width:100%;margin:0;min-height:100vh;}
.sidebar{width:268px;flex:0 0 268px;position:sticky;top:0;align-self:flex-start;max-height:100vh;overflow-y:auto;overflow-x:hidden;padding:18px 12px 40px;background:var(--bg);border-right:1px solid var(--line);}
.content{flex:1 1 0%;min-width:0;width:100%;max-width:100%;padding:0 24px 100px;overflow-x:hidden;}
.brand{font-weight:800;font-size:17px;margin:4px 4px 2px;}
.brand small{display:block;font-weight:500;font-size:11.5px;color:var(--ink-soft);margin-top:2px;}
.side-sub{font-size:11px;color:var(--ink-soft);padding:10px 11px 4px;letter-spacing:.5px;}
.side-chaps{display:grid;gap:3px;}
.sitem{width:100%;text-align:left;background:transparent;border:1px solid transparent;border-radius:9px;padding:8px 10px;cursor:pointer;font:inherit;color:var(--ink);display:flex;gap:8px;align-items:center;transition:.12s;}
.sitem:hover{background:var(--paper);}
.sitem .no{font-size:13px;font-weight:800;color:var(--ink-soft);min-width:34px;}
.sitem .t{flex:1 1 0%;min-width:0;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.sitem .cnt{font-size:10.5px;color:var(--ink-soft);flex:0 0 auto;}
.sitem.active{background:var(--accent-soft);border-color:#e8c9b5;}
.sitem.active .no{color:var(--accent);}
.ppill{font-size:11.5px;color:var(--ink-soft);border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:6px 11px;display:inline-block;margin-top:12px;}
.pbar{height:6px;background:var(--line);border-radius:999px;overflow:hidden;margin:5px 0;}
.pbar>i{display:block;height:100%;background:var(--green);width:0;transition:width .3s;}
.tabbar{position:sticky;top:0;z-index:20;background:rgba(247,243,234,.96);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:10px 22px 0;margin:0 -22px;}
.tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:9px;}
.tabs::-webkit-scrollbar{display:none;}
.tab{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:7px 14px;font-size:13px;color:var(--ink-soft);cursor:pointer;font-family:inherit;white-space:nowrap;transition:.12s;display:flex;align-items:center;gap:6px;}
.tab:hover{border-color:var(--accent);color:var(--accent);}
.tab.on{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:600;}
.tab .n{font-size:10.5px;background:rgba(0,0,0,.08);border-radius:999px;padding:1px 6px;}
.tab.on .n{background:rgba(255,255,255,.25);}
.tab.global{border-style:dashed;}
.tab .dot{width:6px;height:6px;border-radius:50%;background:var(--red);display:none;}
.tab .dot.show{display:block;}
.crumb{display:flex;align-items:center;gap:8px;padding:14px 0 2px;flex-wrap:wrap;}
.crumb h1{font-size:19px;margin:0;}
.crumb .ix{color:var(--accent);font-size:13px;font-weight:700;}
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px 18px;margin:14px 0;}
.btn{border:1px solid var(--line);background:var(--paper);border-radius:9px;padding:7px 13px;cursor:pointer;font-size:12.5px;color:var(--ink);font-family:inherit;transition:.12s;}
.btn:hover{border-color:var(--accent);color:var(--accent);}
.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent);}
.btn.primary:hover{color:#fff;opacity:.9;}
.btn:focus-visible,.sitem:focus-visible,summary:focus-visible,.copy:focus-visible,.tab:focus-visible{outline:3px solid var(--blue-soft);outline-offset:1px;}
.why{background:var(--blue-soft);border-left:4px solid var(--blue);border-radius:10px;padding:12px 14px;margin:10px 0;font-size:15px;}
.why::before{content:"🎯 为什么学这个 · ";font-weight:700;color:var(--blue);}
.analogy{background:var(--accent-soft);border:1px solid #e8c9b5;border-left:4px solid var(--accent);border-radius:10px;padding:12px 14px;margin:10px 0;font-size:15px;}
.analogy::before{content:"💡 打个比方 · ";font-weight:700;color:var(--accent);}
.keypoint{background:var(--green-soft);border-left:4px solid var(--green);border-radius:10px;padding:10px 14px;margin:10px 0;font-size:15px;}
.keypoint::before{content:"🔑 记这个 · ";font-weight:700;color:var(--green);}
.pitfall{background:var(--amber-soft);border-left:4px solid var(--amber);border-radius:10px;padding:10px 14px;margin:10px 0;font-size:15px;}
.pitfall::before{content:"⚠️ 易错 · ";font-weight:700;color:var(--amber);}
.step-chain{background:#fbf9f4;border:1px dashed var(--line);border-radius:12px;padding:12px 14px;margin:12px 0;font-size:14.5px;}
.step-chain::before{content:"推导链 · ";font-weight:700;color:var(--accent);}
.figure{background:#fbf9f4;border:1px dashed var(--line);border-radius:12px;padding:14px;margin:14px 0;text-align:center;}
.figure svg{max-width:100%;height:auto;}
.figure figcaption{font-size:12px;color:var(--ink-soft);margin-top:8px;}
.worked{border:1px solid var(--line);border-left:4px solid var(--blue);border-radius:12px;background:var(--paper);padding:14px 16px;margin:12px 0;}
.worked .wt{font-size:12px;color:var(--blue);font-weight:700;letter-spacing:.5px;margin-bottom:6px;}
.worked .stem{font-size:15px;margin:6px 0 10px;}
.first{background:var(--blue-soft);border-radius:10px;padding:9px 12px;margin:10px 0;font-size:14px;}
.first::before{content:"🧭 起手式 · ";font-weight:700;color:var(--blue);}
.wstep{margin:7px 0;padding-left:12px;border-left:2px solid var(--line);font-size:14.5px;}
.wstep b{color:var(--accent);}
.take{background:var(--green-soft);border-radius:10px;padding:9px 12px;margin-top:10px;font-size:13.5px;}
.take::before{content:"↩︎ 回头看 · ";font-weight:700;color:var(--green);}
.problems{display:grid;gap:12px;}
.prob{border:1px solid var(--line);border-radius:12px;background:var(--paper);padding:14px 16px;}
.prob .phead{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:8px;}
.tag{font-size:11px;border-radius:999px;padding:3px 10px;font-weight:600;}
.tag.lv1{background:var(--green-soft);color:var(--green);}
.tag.lv2{background:var(--blue-soft);color:var(--blue);}
.tag.lv3{background:var(--amber-soft);color:var(--amber);}
.tag.kpt{background:var(--accent-soft);color:var(--accent);}
.prob .stem{font-size:15px;margin:6px 0 10px;}
.prob details{border-top:1px dashed var(--line);margin-top:6px;}
.prob summary{cursor:pointer;padding:9px 2px;font-size:12.5px;color:var(--accent);font-weight:600;list-style:none;}
.prob summary::-webkit-details-marker{display:none;}
.prob .sol{padding:2px 0 6px;font-size:14.5px;}
.prob .sol .step{margin:6px 0;}
.prob .tip{margin-top:10px;background:var(--blue-soft);border-left:4px solid var(--blue);border-radius:10px;padding:8px 12px;font-size:13.5px;}
.prob .tip::before{content:"📌 一句话点睛 · ";font-weight:700;color:var(--blue);}
.prow{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;}
.prow .mark{border:1px solid var(--line);background:#fff;border-radius:8px;padding:5px 11px;font-size:12px;cursor:pointer;font-family:inherit;color:var(--ink-soft);}
.prow .mark:hover{border-color:var(--red);color:var(--red);}
.prow .mark.on{background:var(--red-soft);border-color:var(--red);color:var(--red);font-weight:600;}
.qc{border:1px solid var(--line);border-radius:12px;background:var(--paper);padding:13px 15px;margin:10px 0;}
.qc .qq{font-size:14.5px;}
.qc .qa{margin-top:8px;font-size:14px;color:var(--ink-soft);display:none;}
.qc.show .qa{display:block;}
.qc .qbtn{font-size:12px;color:var(--accent);cursor:pointer;font-weight:600;margin-top:6px;display:inline-block;}
.checklist{list-style:none;padding:0;margin:0;display:grid;gap:8px;}
.ck{display:flex;gap:12px;align-items:flex-start;background:var(--paper);border:1px solid var(--line);border-left:4px solid var(--line);border-radius:10px;padding:11px 14px;cursor:pointer;transition:.12s;}
.ck:hover{border-color:var(--accent);}
.ck .ct{flex:1;font-size:14.5px;}
.ck .st{font-size:10.5px;color:var(--ink-soft);display:block;margin-top:4px;}
.ck[data-s="2"]{background:var(--green-soft);border-left-color:var(--green);}
.ck[data-s="1"]{background:var(--amber-soft);border-left-color:var(--amber);}
.ck[data-s="0"]{background:var(--red-soft);border-left-color:var(--red);}
.ck[data-s="2"] .st{color:var(--green);}
.ck[data-s="1"] .st{color:var(--amber);}
.ck[data-s="0"] .st{color:var(--red);}
.formulas{display:grid;gap:10px;}
.fcard{border:1px solid var(--line);border-radius:12px;background:var(--paper);overflow:hidden;}
.fcard .fbody{display:flex;gap:12px;padding:11px 14px;align-items:center;justify-content:space-between;}
.fcard .latex{font-size:17px;flex:1;overflow-x:auto;}
.fcard .copy{border:1px solid var(--line);background:#fff;border-radius:8px;padding:5px 10px;cursor:pointer;font-size:11.5px;color:var(--ink-soft);white-space:nowrap;font-family:inherit;}
.fcard details{border-top:1px dashed var(--line);}
.fcard summary{cursor:pointer;padding:8px 14px;font-size:12.5px;color:var(--accent);font-weight:600;list-style:none;}
.fcard summary::-webkit-details-marker{display:none;}
.fcard .fdetail{padding:0 14px 12px;font-size:13.5px;color:var(--ink-soft);}
.fcard .fdetail p{margin:5px 0;}
.fcard .fdetail .tag{display:inline-block;font-size:10.5px;background:var(--blue-soft);color:var(--blue);padding:2px 8px;margin-right:6px;}
.zone h2{font-size:13px;color:var(--accent);letter-spacing:.5px;margin:0 0 10px;display:flex;align-items:center;gap:8px;}
.zone h2::before{content:"";width:4px;height:14px;background:var(--accent);border-radius:2px;}
.muted{font-size:12px;color:var(--ink-soft);}
.empty{text-align:center;padding:44px 10px;color:var(--ink-soft);font-size:14px;}
.toTop{position:fixed;right:18px;bottom:20px;width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--paper);color:var(--accent);font-size:19px;cursor:pointer;box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:.2s;z-index:40;}
.toTop.show{opacity:1;pointer-events:auto;}
footer{margin-top:36px;font-size:11.5px;color:var(--ink-soft);text-align:center;}
.note-item{border:1px solid var(--line);border-radius:11px;background:var(--paper);padding:12px 14px;margin:9px 0;}
.note-item .ni-h{font-size:11.5px;color:var(--ink-soft);margin-bottom:5px;}
.note-item .ni-b{font-size:14px;}
.wrong-badge{font-size:11px;background:var(--red-soft);color:var(--red);border-radius:999px;padding:2px 9px;font-weight:600;}
/* 防溢出：所有块不超出容器，公式块内部自己滚 */
.card,.prob,.fcard,.figure,.note-item,.worked,.qc{max-width:100%;}
.figure svg{width:100%;max-width:660px;height:auto;display:block;margin:0 auto;}
.fcard .latex{overflow-x:auto;max-width:100%;}
.tabbar{max-width:100%;}
/* 窄屏目录开关 */
.side-toggle{display:none;width:100%;text-align:left;background:var(--paper);border:1px solid var(--line);border-radius:9px;padding:7px 11px;font:inherit;font-size:13px;color:var(--ink);margin-bottom:8px;cursor:pointer;}
@media (max-width:850px){
  .shell{flex-direction:column;}
  .sidebar{width:100%;flex:none;max-height:none;height:auto;position:sticky;top:0;z-index:30;border-right:none;border-bottom:1px solid var(--line);padding:10px 12px;background:rgba(247,243,234,.97);backdrop-filter:blur(6px);overflow:visible;}
  .side-toggle{display:block;}
  .sidebar .side-chaps{display:none;}
  .sidebar .side-sub{display:none;}
  .sidebar.open .side-chaps{display:grid;}
  .sidebar.open .side-sub{display:block;}
  .content{padding:0 14px 90px;}
  .tabbar{margin:0 -14px;padding-left:14px;padding-right:14px;}
  .crumb h1{font-size:17px;}
}
/* ===== 板块仪表盘 ===== */
.dash{display:grid;grid-template-columns:repeat(auto-fit,minmax(238px,1fr));gap:12px;margin-top:14px;}
.dcard{position:relative;background:var(--paper);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);
  padding:15px 16px;cursor:pointer;text-align:left;font:inherit;color:inherit;transition:.15s;display:flex;flex-direction:column;gap:5px;}
.dcard:hover{transform:translateY(-2px);border-color:var(--accent);}
.dcard .ic{font-size:20px;line-height:1;}
.dcard .nm{font-weight:700;font-size:14.5px;}
.dcard .ds{font-size:11.5px;color:var(--ink-soft);line-height:1.55;}
.dcard .badge{position:absolute;top:12px;right:12px;font-size:11px;font-weight:700;border-radius:999px;padding:2px 9px;background:var(--accent-soft);color:var(--accent);}
.dcard .badge.red{background:var(--red-soft);color:var(--red);}
.dcard .badge.amber{background:var(--amber-soft);color:var(--amber);}
.dcard .badge.green{background:var(--green-soft);color:var(--green);}
.dcard.primary{border-color:#e8c9b5;background:linear-gradient(180deg,#fffdf7,#fdf3e9);}
.dash-h{display:flex;align-items:baseline;justify-content:flex-start;gap:10px;margin:20px 0 2px;flex-wrap:wrap;}
.dash-h h2{font-size:14px;margin:0;color:var(--accent);letter-spacing:.5px;}
.dash-h .muted{font-size:11.5px;color:var(--ink-soft);}
.timer{font-variant-numeric:tabular-nums;font-weight:700;color:var(--accent);}
.qz{border:1px solid var(--line);border-radius:12px;background:var(--paper);padding:13px 15px;margin:10px 0;}
.qz .n{font-size:11px;color:var(--ink-soft);}

/* ===== 术语小卡（点击弹出） ===== */
.term{border-bottom:1.5px dotted var(--accent);cursor:pointer;color:inherit;background:rgba(180,85,45,.045);border-radius:2px;padding:0 1px;}
.term:hover{background:var(--accent-soft);}
.term.future{border-bottom-style:dashed;opacity:.85;}
#pop{position:absolute;z-index:80;width:340px;max-width:calc(100vw - 24px);max-height:62vh;overflow:auto;
  background:var(--paper);border:1px solid var(--line);border-radius:14px;box-shadow:0 10px 30px rgba(50,35,15,.16);display:none;}
#pop.on{display:block;}
#pop .pop-h{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 14px 8px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--paper);}
#pop .pop-h b{font-size:15px;}
#pop .pop-x{border:none;background:transparent;font-size:18px;color:var(--ink-soft);cursor:pointer;line-height:1;padding:2px 4px;}
#pop .pop-b{padding:10px 14px 14px;font-size:13.5px;}
#pop .pop-sec{margin:9px 0;}
#pop .pop-sec .k{display:inline-block;font-size:10.5px;font-weight:700;color:var(--accent);background:var(--accent-soft);border-radius:6px;padding:1px 7px;margin-bottom:3px;}
#pop .pop-sec p{margin:2px 0;}
#pop .pop-sec ol{margin:4px 0 0 18px;padding:0;}
#pop .pop-sec li{margin:2px 0;}
#pop .pop-go{display:inline-block;margin-top:8px;font-size:12px;color:var(--blue);border-bottom:1px dashed var(--blue);cursor:pointer;}
#pop .pop-warn{background:var(--amber-soft);border-radius:9px;padding:9px 11px;font-size:13px;margin:6px 0;}
@media (max-width:850px){
  #pop{position:fixed!important;left:0!important;right:0!important;bottom:0!important;top:auto!important;
    width:auto;max-width:none;max-height:72vh;border-radius:16px 16px 0 0;box-shadow:0 -8px 26px rgba(50,35,15,.2);}
}

/* ===================================================================
   设计层 v2：层级 / 密度 / 质感 / 移动端
   原则：字更少层级更清、间距收紧约 20%、卡片有三层阴影、
        长文限宽 72ch、触控目标 >=44px
   =================================================================== */
:root{
  --fs-h1:22px; --fs-h2:15px; --fs-body:15px; --fs-sm:13px; --fs-xs:11px;
  --lh:1.72;
  --sp1:4px; --sp2:8px; --sp3:12px; --sp4:16px; --sp5:22px; --sp6:30px;
  --ink-3:#8A8478;
  --line-soft:#EDE5D6;
  --accent-deep:#8F3F1F;
  --sh-1:0 1px 2px rgba(60,45,20,.05);
  --sh-2:0 1px 2px rgba(60,45,20,.05), 0 6px 16px rgba(60,45,20,.05);
  --sh-3:0 2px 4px rgba(60,45,20,.06), 0 12px 28px rgba(60,45,20,.09);
  --measure:72ch;
}

/* ---- 排版：三档层级 ---- */
body{font-size:var(--fs-body);line-height:var(--lh);letter-spacing:.1px;}
p{margin:var(--sp2) 0;max-width:var(--measure);}
.brand{font-size:16px;letter-spacing:.2px;}
.brand small{font-size:11.5px;color:var(--ink-3);letter-spacing:.3px;}
.crumb{padding:12px 0 2px;}
.crumb h1{font-size:var(--fs-h1);font-weight:800;letter-spacing:-.2px;line-height:1.35;}
.crumb .ix{font-size:12px;}
.zone h2{font-size:var(--fs-h2);letter-spacing:.3px;margin-bottom:var(--sp2);}
.zone h2::before{height:13px;width:3px;border-radius:2px;}
.muted{color:var(--ink-3);}
.dash-h{margin:var(--sp5) 0 2px;}
.dash-h h2{font-size:13px;letter-spacing:.4px;}
.dash-h .muted{font-size:var(--fs-xs);}

/* ---- 卡片质感 ---- */
.card{padding:14px 16px;margin:10px 0;border-radius:12px;box-shadow:var(--sh-2);}
.dcard{padding:13px 14px;gap:4px;border-radius:12px;box-shadow:var(--sh-1);}
.dcard:hover{box-shadow:var(--sh-3);transform:translateY(-2px);}
.dcard:active{transform:translateY(-1px) scale(.995);}
.dcard .ic{font-size:17px;}
.dcard .nm{font-size:14px;line-height:1.4;}
.dcard .ds{font-size:11.5px;color:var(--ink-3);line-height:1.5;}
.dcard .badge{top:10px;right:10px;font-size:10.5px;padding:1px 8px;}
.dash{gap:10px;margin-top:12px;}
.prob{padding:12px 14px;border-radius:12px;box-shadow:var(--sh-1);}
.prob .stem{font-size:14.5px;line-height:1.6;max-width:var(--measure);}
.note-item{padding:10px 13px;border-radius:10px;box-shadow:var(--sh-1);margin:8px 0;}
.note-item .ni-b{font-size:13.5px;line-height:1.6;}
.note-item .ni-h{font-size:var(--fs-xs);color:var(--ink-3);margin-bottom:3px;}
.worked{padding:12px 14px;border-radius:12px;box-shadow:var(--sh-1);}
.worked .stem{font-size:14.5px;}
.wstep{font-size:13.5px;margin:6px 0;line-height:1.6;}
.qc{padding:11px 13px;border-radius:10px;box-shadow:var(--sh-1);}
.qc .qq{font-size:13.5px;}

/* ---- 讲解块：收紧 + 统一节奏 ---- */
.why,.analogy,.keypoint,.pitfall{padding:10px 13px;margin:8px 0;font-size:14px;line-height:1.7;border-radius:9px;}
.first{padding:8px 11px;margin:8px 0;font-size:13.5px;line-height:1.6;border-radius:8px;}
.take{padding:8px 11px;margin-top:8px;font-size:12.5px;line-height:1.6;}
.tip{padding:8px 11px;font-size:12.5px;line-height:1.6;}
.step-chain{padding:10px 13px;margin:10px 0;font-size:13.5px;border-radius:10px;}

/* ---- 考前速记：按章收纳折叠块 ---- */
.spd-ch{border:1px solid var(--line);border-radius:11px;background:var(--paper);margin:10px 0;overflow:hidden;}
.spd-ch summary{cursor:pointer;list-style:none;padding:11px 14px;font-size:14px;font-weight:700;display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.spd-ch summary::-webkit-details-marker{display:none;}
.spd-ch[open] summary{border-bottom:1px solid var(--line);}
.spd-ch .spd-tags{font-size:11px;font-weight:400;color:var(--ink-3);background:var(--line);border-radius:999px;padding:2px 9px;}
.spd-ch .note-item{box-shadow:none;margin:8px 14px;border:1px solid var(--line);}

/* ---- 清单 / 按钮 / 标签：密度收紧 ---- */
.checklist{gap:6px;}
.ck{padding:9px 12px;border-radius:9px;}
.ck .ct{font-size:13.5px;line-height:1.6;}
.ck .st{font-size:10.5px;margin-top:2px;}
.btn{padding:6px 12px;font-size:12px;border-radius:8px;}
.btn:active{transform:scale(.98);}
.tab{padding:6px 12px;font-size:12.5px;}
.sitem{padding:7px 9px;align-items:flex-start;}
.sitem .t{font-size:12.5px;white-space:normal;line-height:1.4;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.sitem .no{font-size:12px;min-width:32px;}
.sitem .cnt{font-size:10px;}
.side-sub{font-size:10.5px;padding:9px 9px 3px;color:var(--ink-3);}
.ppill{font-size:11px;padding:5px 10px;}
.fcard .latex{font-size:16px;}
.fcard .fbody{padding:9px 13px;}
.fcard summary{padding:7px 13px;font-size:12px;}
.fcard .fdetail{padding:0 13px 10px;font-size:13px;}
.problems{gap:10px;}
.formulas{gap:8px;}

/* ---- 返回上一页 ---- */
.backrow{display:flex;align-items:center;gap:10px;padding:12px 0 2px;}
.backrow .btn{font-size:12px;padding:6px 12px;box-shadow:none;}
.backrow .muted{font-size:11.5px;}

/* ---- 状态反馈 ---- */
.pbar{height:5px;}
.pbar>i{transition:width .45s cubic-bezier(.4,0,.2,1);}
.ck{transition:background .16s,border-color .16s,transform .12s;}
.ck:active{transform:scale(.995);}
.dcard,.sitem,.tab,.btn{transition:background .16s,border-color .16s,box-shadow .18s,transform .15s,color .16s;}

/* ---- 移动端：底部导航 + 更大触控 ---- */
.mobnav{display:none;}
@media (max-width:850px){
  /* 顶部条压缩：品牌与目录开关同一行 */
  .sidebar{padding:8px 12px 10px;display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;overflow:hidden;}
  .sidebar .ppill,.sidebar .pbar{display:none;}
  .sidebar .brand{flex:1 1 auto;min-width:0;font-size:15px;margin:0;letter-spacing:0;order:1;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .sidebar .brand small{display:none;}
  .sidebar .side-toggle{flex:0 0 auto;width:auto;margin:0;padding:7px 11px;font-size:12.5px;border-radius:8px;order:2;}
  .sidebar .sitem[data-dash="home"]{display:none;}
  .sidebar .side-sub,.sidebar .side-chaps{flex:1 1 100%;order:3;}
  .sidebar .side-chaps{margin-top:2px;}
  .mobnav{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:46;
    background:rgba(255,253,247,.97);backdrop-filter:blur(10px);
    border-top:1px solid var(--line);padding:5px 4px calc(5px + env(safe-area-inset-bottom));}
  .mobnav button{flex:1;background:none;border:none;font:inherit;color:var(--ink-3);
    font-size:10px;display:flex;flex-direction:column;align-items:center;gap:2px;
    padding:5px 2px 4px;min-height:44px;cursor:pointer;border-radius:8px;position:relative;}
  .mobnav button .mi{font-size:16px;line-height:1;position:relative;}
  .mobnav button.on{color:var(--accent);font-weight:700;}
  .mobnav button.on .mi::after{content:"";position:absolute;left:50%;bottom:-5px;transform:translateX(-50%);
    width:14px;height:2px;border-radius:2px;background:var(--accent);}
  .mobnav .mb{position:absolute;top:0;right:50%;margin-right:-18px;background:var(--red);color:#fff;
    font-size:9px;border-radius:999px;padding:0 4px;line-height:13px;min-width:13px;text-align:center;}
  .toTop{bottom:72px;width:38px;height:38px;font-size:17px;}
  .content{padding-bottom:110px!important;}
  .crumb h1{font-size:19px;}
  .card{padding:12px 13px;}
  .dcard{padding:12px 13px;}
  .why,.analogy,.keypoint,.pitfall{font-size:14.5px;padding:10px 13px;}
  .prob .stem{font-size:14.5px;}
  .tabbar{padding-top:8px;}
  .tabs{gap:5px;}
  .tab{padding:7px 12px;}
}
@media (max-width:420px){
  .dash{grid-template-columns:1fr;}
  .crumb h1{font-size:18px;}
}

/* ===== 横屏矮屏（手机/平板横放）：压上下框架，把高度让给内容 ===== */
@media (orientation:landscape) and (max-height:780px){
  /* 顶栏压缩：tabbar + 面包屑 + 返回行 */
  .tabbar{padding:2px 14px 0;}
  .tabs{padding-bottom:2px;}
  .tab{padding:3px 9px;font-size:11.5px;}
  .crumb{padding:2px 0 0;}
  .crumb h1{font-size:15px;}
  .crumb .ix{font-size:11.5px;}
  .backrow{padding:2px 0 0;}
  .card{margin:6px 0;}
  /* 横屏取消 sticky 浮动（高度短，浮动侧栏会盖住内容卡片）；宽度只在桌面宽另设 */
  .sidebar{position:static;max-height:none;z-index:auto;}
  .brand{font-size:14px;margin:2px 4px;}
  .brand small{font-size:10.5px;}
  .sitem{padding:4px 8px;}
  /* 移动宽：底部导航压扁 */
  .mobnav{padding:2px 4px calc(2px + env(safe-area-inset-bottom));}
  .mobnav button{min-height:34px;padding:2px 2px;font-size:9px;}
  .mobnav button .mi{font-size:13px;}
  .content{padding-bottom:76px!important;}
  .toTop{bottom:56px;width:32px;height:32px;font-size:14px;}
}
/* 桌面宽横屏：侧栏收窄让横向空间 */
@media (orientation:landscape) and (max-height:780px) and (min-width:851px){
  .sidebar{width:192px;flex:0 0 192px;padding:8px 10px 20px;}
  .brand small{font-size:10.5px;}
}
/* 手机横屏（仍走移动布局）：顶栏行压扁，但保留 wrap，目录列表独占整行 */
@media (orientation:landscape) and (max-height:780px) and (max-width:850px){
  .sidebar{position:static;z-index:auto;max-height:none;padding:5px 10px;gap:3px 6px;flex-wrap:wrap;overflow:hidden;}
  /* 顶栏三项占满第一行：☰目录 | 品牌(可省略) | 🌙主题 */
  .sidebar .side-toggle{order:1;padding:3px 8px;font-size:11.5px;}
  .sidebar .brand{order:2;font-size:13px;flex:1 1 0%;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .sidebar .side-theme-row{order:3;flex:0 0 auto;margin:0;gap:3px;}
  .sidebar .side-theme-row .sitem{padding:3px 7px;min-width:0;}
  /* 目录列表独占后续整行（覆盖基础布局的 flex:1 1 100%，避免被挤成 1 字宽） */
  .sidebar .side-sub,.sidebar .side-chaps{flex:1 1 100%;order:4;}
  /* 关键：只在展开时才显示（不能无条件 display:grid，否则默认就把目录全铺开把内容顶下去） */
  .sidebar.open .side-chaps{display:grid;grid-template-columns:1fr;margin-top:3px;}
  .dash-h{margin:8px 0 0;}
  .dash{gap:7px;margin-top:7px;}
  .dcard{padding:9px 11px;}
}

/* ===== 深色主题：只换变量，结构不动 ===== */
:root[data-theme="dark"]{
  --bg:#191815; --paper:#242219; --ink:#ece6da; --ink-soft:#b6b0a2;
  --line:#3b382e; --accent:#e0894f; --accent-soft:#3a2c1f;
  --green:#5ea87f; --green-soft:#23332a; --amber:#d89b45; --amber-soft:#3a3120;
  --red:#c96055; --red-soft:#3a2620; --blue:#6f9bc9; --blue-soft:#253039;
  --ink-3:#8a8478; --line-soft:#3b382e; --accent-deep:#e89a6a;
  --sh-1:0 1px 2px rgba(0,0,0,.35);
  --sh-2:0 1px 2px rgba(0,0,0,.35),0 6px 16px rgba(0,0,0,.35);
  --sh-3:0 2px 4px rgba(0,0,0,.4),0 12px 28px rgba(0,0,0,.5);
  --shadow:0 2px 10px rgba(0,0,0,.35),0 1px 3px rgba(0,0,0,.3);
  color-scheme:dark;
}
/* 防止过滚动 / 页面外露白 */
:root[data-theme="dark"], :root[data-theme="dark"] body{background:#191815;}
:root[data-theme="dark"] .tabbar{background:rgba(25,24,21,.96);}
/* 移动端顶栏 / 底部导航：原本硬编码浅色，这里跟随暗色主题 */
:root[data-theme="dark"] .sidebar{background:rgba(25,24,21,.97);}
:root[data-theme="dark"] .mobnav{background:rgba(25,24,21,.97);}
:root[data-theme="dark"] .prow .mark, :root[data-theme="dark"] .fcard .copy{background:var(--bg);}
:root[data-theme="dark"] .sitem.active{border-color:#4a3b2a;}
:root[data-theme="dark"] .analogy, :root[data-theme="dark"] .sres-item.active{border-color:#4a3b2a;}
:root[data-theme="dark"] .figure, :root[data-theme="dark"] .step-chain{background:#1f1d18;}
:root[data-theme="dark"] .dcard.primary{background:linear-gradient(180deg,#242219,#2a2418);}
/* 暗色：把硬编码暖色/阴影纳入主题（#pop 弹卡、搜索蒙层与面板、术语点状底） */
:root[data-theme="dark"] #pop{box-shadow:0 10px 30px rgba(0,0,0,.6);}
:root[data-theme="dark"] .search-overlay{background:rgba(0,0,0,.62);}
:root[data-theme="dark"] .search-panel{box-shadow:0 18px 50px rgba(0,0,0,.6);}
:root[data-theme="dark"] .term{background:rgba(224,137,79,.1);}

/* ===== 全局搜索弹层（Spotlight 式，Ctrl+K / 顶部图标） ===== */
.search-fab{position:fixed;left:50%;transform:translateX(-50%);bottom:76px;z-index:60;width:46px;height:46px;border-radius:50%;
  border:1px solid var(--line);background:var(--paper);color:var(--accent);font-size:18px;cursor:pointer;
  box-shadow:var(--sh-3);display:none;align-items:center;justify-content:center;}
@media (max-width:850px){ .search-fab{display:flex;} .search-fab{bottom:76px;} }
/* 横屏：搜索钮从左中挪到右下，避免压住内容（放基础规则之后才能生效） */
@media (orientation:landscape) and (max-height:780px){
  .search-fab{left:auto;right:18px;transform:none;bottom:96px;width:38px;height:38px;font-size:15px;}
}
.search-overlay{position:fixed;inset:0;z-index:90;background:rgba(30,22,10,.45);backdrop-filter:blur(3px);display:none;}
.search-overlay.on{display:block;}
.search-panel{position:relative;margin:0 auto;max-width:620px;width:calc(100% - 28px);height:min(560px,80vh);
  display:flex;flex-direction:column;background:var(--paper);border:1px solid var(--line);border-radius:16px;
  box-shadow:0 18px 50px rgba(30,20,5,.28);overflow:hidden;}
@media (min-width:851px){ .search-panel{margin-top:12vh;} }
.search-panel-head{display:flex;gap:8px;padding:14px 14px 10px;border-bottom:1px solid var(--line);align-items:center;}
.search-panel-head input{flex:1;border:none;background:transparent;font:inherit;font-size:16px;color:var(--ink);outline:none;}
.search-panel-head .btn{flex:0 0 auto;}
.search-stat{font-size:11px;color:var(--ink-3);padding:8px 16px 2px;min-height:14px;}
.search-list{flex:1;overflow-y:auto;padding:4px 10px 10px;}
.sres-item{display:flex;flex-direction:column;gap:2px;border:1px solid transparent;border-radius:10px;background:transparent;
  padding:9px 12px;margin:4px 0;cursor:pointer;position:relative;}
.sres-item.active{background:var(--accent-soft);border-color:#e8c9b5;}
.sres-item .h{font-size:13.5px;font-weight:600;}
.sres-item .h mark{background:var(--amber-soft);color:var(--amber);border-radius:2px;padding:0 1px;}
.sres-item .s{font-size:11.5px;color:var(--ink-3);max-width:72ch;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.sres-item .kind{position:absolute;right:12px;top:9px;font-size:10px;color:var(--ink-3);background:var(--line-soft);
  border-radius:999px;padding:1px 7px;}
.sres-g{font-size:10.5px;font-weight:700;color:var(--accent);letter-spacing:.4px;margin:10px 4px 2px;}
.sres-empty{text-align:center;padding:34px 10px;color:var(--ink-3);font-size:13px;line-height:2;}
.search-foot{font-size:10.5px;color:var(--ink-3);padding:7px 16px;border-top:1px solid var(--line);text-align:center;}
@media (max-width:850px){ .search-panel{width:100%;height:88vh;margin-top:2vh;border-radius:0;border-left:none;border-right:none;} }

/* ===== 章节数据图（纯 CSS 柱，不引 Chart.js） ===== */
.bars{margin:12px 0;}
.bar-row{display:grid;grid-template-columns:118px 1fr 56px;align-items:center;gap:10px;margin:7px 0;}
.bar-row .lbl{font-size:12.5px;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.bar-track{height:16px;background:var(--line-soft);border-radius:999px;overflow:hidden;}
.bar-track i{display:block;height:100%;background:var(--accent);border-radius:999px;transition:width .4s;}
.bar-track i.good{background:var(--green);}
.bar-row .val{font-size:11.5px;color:var(--ink-3);text-align:right;}
.bar-legend{font-size:11px;color:var(--ink-3);margin-top:6px;display:flex;gap:14px;flex-wrap:wrap;}
.bar-legend b{color:var(--ink);font-weight:600;}
@media print{
  .sidebar,.toTop,.tabbar,.prow,.btn,.search-wrap,.bars{display:none!important;}
  body{background:#fff;}
  .card,.note-item{box-shadow:none;}
  .spd-ch{border:none;border-bottom:1px solid var(--line);margin:0 0 10px;}
  .spd-ch summary{border:none;padding:6px 0;}
  .spd-ch .note-item{border:none;margin:6px 0;}
}
</style>
</head>
<body>
<div id="errbanner" style="display:none;position:sticky;top:0;z-index:99;background:#7a1f1f;color:#fff;font:13px/1.6 Consolas,monospace;padding:10px 16px;white-space:pre-wrap"></div>
<script>
window.addEventListener("error", function(e){
  var b = document.getElementById("errbanner");
  if(b){ b.style.display="block"; b.textContent = "⚠ JS 报错：" + e.message + "\n文件 " + (e.filename||"-") + " 行 " + (e.lineno||"-"); }
});
</script>
<div class="shell">
  <aside class="sidebar" id="sidebar"></aside>
  <main class="content" id="main"></main>
</div>
<button class="toTop" id="toTop" aria-label="回到顶部">↑</button>
<nav class="mobnav" id="mobnav"></nav>
<button class="search-fab" data-open-search aria-label="搜索">🔍</button>
<div id="pop" role="dialog" aria-modal="false"></div>
<div id="search-overlay" class="search-overlay" aria-hidden="true">
  <div class="search-panel">
    <div class="search-panel-head">
      <input id="search-input" type="text" placeholder="搜概念 / 公式 / 题 / 章节（支持拼音、打错一个字也能中）" autocomplete="off" spellcheck="false">
      <button id="search-close" class="btn" title="关闭 (Esc)">✕</button>
    </div>
    <div class="search-stat" id="search-stat"></div>
    <div class="search-list" id="search-list"></div>
    <div class="search-foot">↑ ↓ 选择 · Enter 打开 · Esc 关闭</div>
  </div>
</div>
<div id="sync-overlay" class="search-overlay" aria-hidden="true">
  <div class="search-panel" style="height:auto;max-height:86vh">
    <div class="search-panel-head">
      <b style="flex:1;font-size:15px">同步码 · 手机 ⇄ 电脑</b>
      <button id="sync-close" class="btn" title="关闭 (Esc)">✕</button>
    </div>
    <div style="padding:14px 16px 18px;overflow:auto">
      <div class="muted" style="font-size:12.5px;line-height:1.7;margin-bottom:10px">
        在<b>A 设备</b>点「生成」→ 复制这段码 → 到<b>B 设备</b>粘贴 → 点「合并」。<br>
        码里只有你的掌握度和错题，不含账号信息，不会上传任何服务器。
      </div>

      <div style="font-size:12.5px;font-weight:700;color:var(--accent);margin:14px 0 6px">① 生成（本机 → 另一台）</div>
      <textarea id="sync-code-out" readonly style="width:100%;height:78px;font:12px/1.5 Consolas,monospace;padding:10px;border:1px solid var(--line);border-radius:9px;background:var(--bg);color:var(--ink);resize:none;word-break:break-all" placeholder="点下面按钮生成"></textarea>
      <div style="display:flex;gap:8px;margin-top:8px;flex-wrap:wrap">
        <button class="btn primary" id="sync-gen">生成同步码</button>
        <button class="btn" id="sync-copy">复制</button>
      </div>

      <div style="font-size:12.5px;font-weight:700;color:var(--accent);margin:18px 0 6px">② 接收（另一台 → 本机）</div>
      <textarea id="sync-code-in" style="width:100%;height:78px;font:12px/1.5 Consolas,monospace;padding:10px;border:1px solid var(--line);border-radius:9px;background:var(--bg);color:var(--ink);resize:none;word-break:break-all" placeholder="把另一台生成的码粘到这里"></textarea>
      <div style="display:flex;gap:8px;margin-top:8px;flex-wrap:wrap;align-items:center">
        <button class="btn primary" id="sync-apply">合并到本机</button>
        <button class="btn" id="sync-paste">从剪贴板粘贴</button>
      </div>
      <div id="sync-msg" class="muted" style="font-size:12px;margin-top:10px;min-height:18px"></div>
    </div>
  </div>
</div>
